name: CI

on:
  pull_request:
  push:

# Read-only permissions: the workflow checks out code and runs tests only.
# No write scopes, no secrets, no deployment steps.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Python version is pinned by the repo Dockerfile (python:3.11-slim),
          # which is the version the application is deployed with.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Test-only dependencies. pytest is not in requirements.txt, and
          # pytest-timeout is required by the `timeout = 300` setting in pytest.ini.
          python -m pip install "pytest>=8,<10" "pytest-timeout>=2,<3"

      - name: Run test suite
        run: python -m pytest -q
