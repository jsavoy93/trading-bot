[pytest]
# Pytest configuration for trading-bot
# Enforces test safety to prevent live brokerage calls

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Enforce strict mode
pythonpath = .

# Markers
markers =
    brokerage: tests that interact with brokerage (should use mock/paper)
    live: tests that explicitly test live mode (should be rare/explicit)
    integration: integration tests that may need more setup
    observational: empirical checks against the live trading_bot.db; not collected by default pytest runs (excluded via -m "not observational" in addopts); run explicitly with `pytest -m observational tests/observational/` (release gate / smoke / post-deploy verification)

# Timeout (prevent hanging tests)
timeout = 300

# Output options
addopts = -v --tb=short -m "not observational"

# Ignore patterns
norecursedirs = .git .venv archive legacy
