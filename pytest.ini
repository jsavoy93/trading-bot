[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts = -ra
markers =
	integration: marks tests as hitting external services (deselect with -m "not integration")
norecursedirs = tests/archive .git .venv __pycache__
filterwarnings =
	ignore:.*websockets\.legacy.*:DeprecationWarning
